name: PR Check

on:
  pull_request:
    branches: [ main, develop ]

jobs:
  pr-validation:
    name: Validar PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          pip install flake8 pytest

      - name: Lint y Test
        run: |
          flake8 backend/
          cd backend && pytest
